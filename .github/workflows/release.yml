name: Релиз

# Тег vX.Y.Z → сборка <id>-<версия>.tar.gz и запись версии для каталога → релиз GitHub с ними.
# Дальше: pulse-plugin publish <клон каталога> --changes "…" и MR в каталог.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Версия в манифесте совпадает с тегом
        run: |
          version=$(python -c "import json;print(json.load(open('pulse-plugin.json',encoding='utf-8'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Тег $GITHUB_REF_NAME, а в манифесте $version"; exit 1; }
      - run: python -m pytest -q
        working-directory: backend
      - name: Сборка
        run: pulse-plugin pack --out dist
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
